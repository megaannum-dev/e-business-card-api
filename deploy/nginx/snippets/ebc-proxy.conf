# Shared proxy settings for the e-business-card API, included by every location
# in focms-ebc-8001.conf.
#
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp deploy/nginx/snippets/ebc-proxy.conf /etc/nginx/snippets/ebc-proxy.conf
#
# Kept in one file so a proxy change cannot be applied to some locations and
# missed on others.

proxy_pass http://127.0.0.1:8002;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;
