# Per-IP rate limit zones for the e-business-card API.
#
# These are http-level directives and CANNOT live in the server block.
# Install to /etc/nginx/conf.d/, which stock nginx.conf includes inside http{}:
#
#   sudo cp deploy/nginx/conf.d/ebc-ratelimit.conf /etc/nginx/conf.d/ebc-ratelimit.conf
#
# Sizing: 1m of shared memory holds ~16k distinct IPs per zone. Raise to 10m
# (~160k) if the user base grows; an exhausted zone starts evicting LRU entries.
#
# rate= is a REFILL SPEED, not a quota per window. rate=300r/m means one token
# every 200ms, not "300 anytime in a minute". burst= is the bucket depth, i.e.
# how many requests may arrive back-to-back before throttling applies.

# Expensive LLM calls: card parsing and image generation. Backed further by the
# per-user quota in app/services/llm_rate_limiter.py (10/hour, 20/day).
# Deliberately tight — this exists to stop scripted abuse reaching Firebase auth.
limit_req_zone $binary_remote_addr zone=ebc_scan:1m   rate=10r/m;

# Ordinary authenticated API traffic: list, create, update, delete, reorder.
# Scan-image downloads are deliberately NOT here — see ebc_image.
limit_req_zone $binary_remote_addr zone=ebc_api:1m    rate=120r/m;

# Scan image downloads. High legitimate fan-out (the wallet screen pulls one
# image per card at once), low server cost. Split out so ebc_api can stay strict.
limit_req_zone $binary_remote_addr zone=ebc_image:1m  rate=600r/m;

# Unauthenticated surface: public share pages, token resolution, privacy/terms,
# and Swagger on dev. No Firebase auth in front of these.
limit_req_zone $binary_remote_addr zone=ebc_public:1m rate=60r/m;

# Connectivity probe. Called before every scan and on offline auto-sync
# (src/utils/network.ts -> isDeviceOnline).
limit_req_zone $binary_remote_addr zone=ebc_health:1m rate=60r/m;

# Concurrent connections per IP.
limit_conn_zone $binary_remote_addr zone=ebc_conn:1m;

# Reject with 429, NOT the nginx default of 503.
# src/utils/network.ts treats 503 as a retryable/offline condition, so a 503
# here would silently push rate-limited users into the offline scan queue
# instead of surfacing an error.
limit_req_status 429;
limit_conn_status 429;
