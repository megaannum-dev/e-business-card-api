# E-Business Card API on existing subdomain + port 8001 (no new DNS record).
# CMS:  https://focms.megaannum.ai      (443) → 127.0.0.1:8000
# EBC:  https://focms.megaannum.ai:8001 (8001) → 127.0.0.1:8002 (Docker)
#
# Prerequisite: SSL cert for focms.megaannum.ai already exists (CMS certbot).
#   sudo certbot --nginx -d focms.megaannum.ai   # if not done yet
#
# Alibaba firewall: open TCP 8001
#
# Install (all three files — the server block alone will fail nginx -t, because
# the rate limit zones are http-level and the proxy snippet is included here):
#
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp deploy/nginx/snippets/ebc-proxy.conf      /etc/nginx/snippets/ebc-proxy.conf
#   sudo cp deploy/nginx/conf.d/00-ebc-ratelimit.conf /etc/nginx/conf.d/00-ebc-ratelimit.conf
#   sudo cp deploy/nginx/focms-ebc-8001.conf          /etc/nginx/conf.d/ebc-api-8001.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# This server has NO sites-available/sites-enabled -- nginx.conf includes
# /etc/nginx/conf.d/*.conf and nothing else. The 00- prefix keeps the rate limit
# zones ahead of this server block in that alphabetical include.
#
# WARNING: install the server block by REPLACING the existing file, never
# alongside it. Two server blocks on the same listen + server_name make nginx
# warn "conflicting server name" and silently use whichever it parsed first;
# edits to the other file then appear to do nothing. Check with:
#   sudo nginx -T | grep -c "listen 8001"        # must be 2 (IPv4 + IPv6), not 4
#
# Test: https://focms.megaannum.ai:8001/docs
#
# ── Location precedence (nginx, not top-to-bottom) ────────────────────────────
#   1. `location = /path`  exact — always wins
#   2. `location ~ regex`  checked IN FILE ORDER, first match wins
#   3. `location /prefix`  longest prefix, only if no regex matched
# The regex blocks below are order-sensitive relative to each other. Keep the
# LLM block above the scan-image block.

server {
    listen 8001 ssl;
    listen [::]:8001 ssl;
    server_name focms.megaannum.ai;

    ssl_certificate /etc/letsencrypt/live/focms.megaannum.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/focms.megaannum.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Dedicated logs. Without these, EBC traffic is interleaved with the CMS on
    # port 443 in the default log, which makes rate-limit tuning and 401/403
    # alerting read the wrong numbers. logrotate's /var/log/nginx/*.log glob
    # picks these up automatically.
    access_log /var/log/nginx/ebc-access.log;
    error_log  /var/log/nginx/ebc-error.log;

    # Front + back scan uploads (base64 in multipart) need more than nginx default 1m.
    # Only three endpoints actually accept uploads — cards/process,
    # cards/offline-draft, user-cards/process. Tightening this to 2m here and
    # overriding to 25m on just those three would shrink the abuse surface, but
    # a wrong guess surfaces as a 413 on scan, so it is left global for now.
    client_max_body_size 25m;

    # Concurrent connections per IP, across every location.
    limit_conn ebc_conn 20;

    # ── Security headers ──────────────────────────────────────────────────────
    # NOTE: `add_header` does NOT merge across levels. If you ever add an
    # add_header inside a location block, re-add this whole set there too.
    #
    # HSTS is scoped to the HOSTNAME and ignores the port, so this policy is
    # shared with the CMS on focms.megaannum.ai:443. Starting at 5 minutes:
    # confirm both services stay healthy, then raise to 31536000. Do not add
    # includeSubDomains until every subdomain is on TLS, and do not add preload
    # unless you are prepared for it to be effectively irreversible.
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Exact matches ─────────────────────────────────────────────────────────

    # Connectivity probe: called before every scan and on offline auto-sync.
    location = /health {
        limit_req zone=ebc_health burst=30 nodelay;
        include /etc/nginx/snippets/ebc-proxy.conf;
    }

    # LLM-backed scan endpoints (fixed paths).
    location = /api/v1/cards/process {
        limit_req zone=ebc_scan burst=5 nodelay;
        include /etc/nginx/snippets/ebc-proxy.conf;
    }
    location = /api/v1/cards/offline-draft {
        limit_req zone=ebc_scan burst=5 nodelay;
        include /etc/nginx/snippets/ebc-proxy.conf;
    }
    location = /api/v1/user-cards/process {
        limit_req zone=ebc_scan burst=5 nodelay;
        include /etc/nginx/snippets/ebc-proxy.conf;
    }
    location = /api/v1/user-cards/parse {
        limit_req zone=ebc_scan burst=5 nodelay;
        include /etc/nginx/snippets/ebc-proxy.conf;
    }

    # Unauthenticated static pages.
    location = /privacy {
        limit_req zone=ebc_public burst=20 nodelay;
        include /etc/nginx/snippets/ebc-proxy.conf;
    }
    location = /terms {
        limit_req zone=ebc_public burst=20 nodelay;
        include /etc/nginx/snippets/ebc-proxy.conf;
    }

    # ── Regex matches (ORDER MATTERS — LLM block must stay first) ─────────────

    # LLM image generation. {card_id} sits mid-path, so `location =` cannot
    # reach these and they would otherwise fall through to ebc_api:
    #   POST /api/v1/cards/{id}/enhance                        (cards.py:347)
    #   POST /api/v1/cards/{id}/scan-image-enhancement/retry   (cards.py:481)
    #   POST /api/v1/user-cards/{id}/scan-image-enhancement/retry (user_cards.py:291)
    # All three carry enforce_llm_rate_limit in the app — the expensive path.
    location ~ ^/api/v1/(cards|user-cards)/[^/]+/(enhance|scan-image-enhancement/retry)$ {
        limit_req zone=ebc_scan burst=5 nodelay;
        include /etc/nginx/snippets/ebc-proxy.conf;
    }

    # Scan image downloads. The `(/|$)` anchor is what stops this from also
    # matching /scan-image-enhancement/retry above — do not drop it.
    location ~ ^/api/v1/(cards|user-cards)/[^/]+/scan-image(/|$) {
        limit_req zone=ebc_image burst=80 nodelay;
        include /etc/nginx/snippets/ebc-proxy.conf;
    }

    # Swagger. Served on dev only (DEPLOY_ENV=prod returns 404 from the app),
    # but unauthenticated on a public port, so it gets the public zone.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        limit_req zone=ebc_public burst=10 nodelay;
        include /etc/nginx/snippets/ebc-proxy.conf;
    }

    # ── Prefix matches ────────────────────────────────────────────────────────

    # Public share-token resolution (no Firebase auth in front).
    location /api/v1/public/ {
        limit_req zone=ebc_public burst=20 nodelay;
        include /etc/nginx/snippets/ebc-proxy.conf;
    }

    # Server-rendered public share page and vCard download.
    location /c/ {
        limit_req zone=ebc_public burst=30 nodelay;
        include /etc/nginx/snippets/ebc-proxy.conf;
    }

    # Everything else: authenticated CRUD.
    location / {
        limit_req zone=ebc_api burst=30 nodelay;
        include /etc/nginx/snippets/ebc-proxy.conf;
    }
}
